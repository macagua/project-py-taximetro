<div class="g-d-c" style="margin-bottom:1.5em;">
    <div class="g-d-12 g-d-f" style="display:flex;gap:1em;flex-wrap:wrap;">

        <!-- Card: Conductores -->
        <div class="grp-module" style="flex:1;min-width:200px;padding:1.2em 1.5em;text-align:center;">
            <div style="font-size:2.8em;font-weight:700;line-height:1.1;color:#4db6e4;">
                {{ conductores_count }}
            </div>
            <div style="margin-top:.4em;font-size:.9em;text-transform:uppercase;letter-spacing:.06em;color:#aaa;">
                Conductores activos
            </div>
            <div style="margin-top:.6em;font-size:.75em;color:#666;">
                <!-- Grupo "Conductores" -->Conductores
            </div>
        </div>

        <!-- Card: Carreras totales -->
        <div class="grp-module" style="flex:1;min-width:200px;padding:1.2em 1.5em;text-align:center;">
            <div style="font-size:2.8em;font-weight:700;line-height:1.1;color:#6abf69;">
                {{ total_rides }}
            </div>
            <div style="margin-top:.4em;font-size:.9em;text-transform:uppercase;letter-spacing:.06em;color:#aaa;">
                Carreras efectuadas
            </div>
            <div style="margin-top:.6em;font-size:.75em;color:#666;">
                Historial completo
            </div>
        </div>

    </div>
</div>
