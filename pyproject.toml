[project]
name = "taximeter"
version = "0.1.0"
description = "TaxiTech Solutions — Taxímetro Digital"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.0",
    "django-grappelli>=5.0.1",
    "django-ninja>=1.8.0",
    "pytest-django>=4.14.0",
    "python-dotenv>=1.2.4",
    "reflex>=0.9.4",
    "reflex-django>=4.0.3",
]

[project.scripts]
taximeter = "taximeter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "fleet.settings"
